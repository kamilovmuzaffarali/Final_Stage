# Датасет для дообучения детектора загрузки грузовика (YOLOv8).
# Собираем сами: реальные фото фур (норма) + масштабные модели/синтетика (крен/свес/незакреп).
# Структура: train/images, train/labels (YOLO txt), val/images, val/labels.
path: ../data
train: images/train
val: images/val

names:
  0: truck            # грузовик/прицеп целиком
  1: cargo            # груз (для свеса/высоты)
  2: strap_loose      # незакреплённый/болтающийся крепёж/тент
  3: door_open        # открытая дверь грузового отсека
