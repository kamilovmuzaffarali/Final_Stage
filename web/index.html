<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load Safety Gate — контроль загрузки на выезде</title>
<style>
  :root{--bg:#0e1014;--card:#171a21;--card2:#1d212a;--ink:#e8eaed;--mut:#9aa0a6;
        --line:#262b33;--go:#1db954;--warn:#ffa726;--nogo:#ff5252;--brand:#2f6fed;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,Segoe UI,Roboto,sans-serif;line-height:1.45}
  .wrap{max-width:860px;margin:0 auto;padding:20px 18px 48px}
  header{display:flex;align-items:center;gap:12px;margin:4px 0 6px}
  .logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#2f6fed,#1db954);
        display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:20px;margin:0}
  .sub{color:var(--mut);margin:2px 0 18px;font-size:14px}
  .card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;
        border:1px solid var(--line)}
  .sec-t{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;
         margin:22px 0 10px}

  /* KPI дашборд смены */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi .n{font-size:26px;font-weight:800}
  .kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  .kpi.go .n{color:var(--go)} .kpi.block .n{color:var(--nogo)} .kpi.na .n{color:var(--mut)}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}

  input[type=file]{width:100%;padding:12px;background:#0d0f13;border:1px dashed #30343c;
                   border-radius:10px;color:var(--ink)}
  button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:10px;
         background:var(--brand);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5}

  /* Талон осмотра */
  .ticket{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
  .tk-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;
          background:var(--card2);font-size:13px;color:var(--mut)}
  .tk-no{font-weight:700;color:var(--ink);letter-spacing:.03em}
  .verdict{font-size:30px;font-weight:800;text-align:center;padding:16px 10px}
  .verdict small{display:block;font-size:13px;font-weight:600;opacity:.9;margin-top:4px}
  .GO .verdict{background:rgba(29,185,84,.14);color:var(--go)}
  .WARN .verdict{background:rgba(255,167,38,.14);color:var(--warn)}
  .NOGO .verdict,.NODATA .verdict,.CANNOTASSESS .verdict{background:rgba(255,82,82,.14);color:var(--nogo)}
  .tk-body{padding:14px 16px}
  table{width:100%;border-collapse:collapse} td{padding:8px 4px;border-bottom:1px solid var(--line)}
  .pill{padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700}
  .ok{background:rgba(29,185,84,.2);color:var(--go)}
  .warn{background:rgba(255,167,38,.2);color:var(--warn)}
  .nogo{background:rgba(255,82,82,.2);color:var(--nogo)}
  .cannot{background:rgba(154,160,166,.2);color:var(--mut)}
  .tk-body img{width:100%;border-radius:10px;margin-top:12px}
  .mut{color:var(--mut);font-size:13px}

  /* Журнал смены */
  .log td{font-size:13px}
  .badge{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800}
  .badge.GO{background:rgba(29,185,84,.18);color:var(--go)}
  .badge.WARN{background:rgba(255,167,38,.18);color:var(--warn)}
  .badge.NOGO,.badge.NODATA,.badge.CANNOTASSESS{background:rgba(255,82,82,.18);color:var(--nogo)}

  /* Примеры */
  .examples{display:flex;gap:12px;flex-wrap:wrap}
  .ex{flex:1;min-width:250px;background:var(--card);border-radius:12px;overflow:hidden;
      border:1px solid var(--line);border-left:5px solid #444}
  .ex.GO{border-left-color:var(--go)} .ex.WARN{border-left-color:var(--warn)}
  .ex.NOGO,.ex.NODATA,.ex.CANNOTASSESS{border-left-color:var(--nogo)}
  .ex img{width:100%;margin:0;border-radius:0;display:block}
  .ex .exhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
  .ex .exv{font-weight:800;font-size:18px}
  .ex.GO .exv{color:var(--go)} .ex.WARN .exv{color:var(--warn)}
  .ex.NOGO .exv,.ex.NODATA .exv,.ex.CANNOTASSESS .exv{color:var(--nogo)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🚚</div>
    <div>
      <h1>Load Safety Gate</h1>
      <div class="sub" style="margin:0">Контроль безопасности загрузки на выезде — одно фото → решение о выпуске</div>
    </div>
  </header>

  <!-- Дашборд смены -->
  <div class="sec-t">Смена сегодня</div>
  <div class="kpis" id="kpis">
    <div class="kpi"><div class="n" id="k-total">—</div><div class="l">Осмотров</div></div>
    <div class="kpi go"><div class="n" id="k-go">—</div><div class="l">Выпущено (GO)</div></div>
    <div class="kpi block"><div class="n" id="k-block">—</div><div class="l">Задержано</div></div>
    <div class="kpi na"><div class="n" id="k-na">—</div><div class="l">Не оценить</div></div>
  </div>

  <!-- Новый осмотр -->
  <div class="sec-t">Новый осмотр</div>
  <div class="card">
    <input id="file" type="file" accept="image/*">
    <button id="go" onclick="run()">Проверить загрузку и выдать талон</button>
  </div>
  <div id="out"></div>

  <!-- Журнал смены -->
  <div class="sec-t">Журнал смены</div>
  <div class="card" style="padding:4px 14px">
    <table class="log"><tbody id="logbody"><tr><td class="mut" style="padding:14px 4px">Пока нет осмотров.</td></tr></tbody></table>
  </div>

  <!-- Демо-кейсы -->
  <div class="sec-t">Демо-кейсы (посчитаны реальным пайплайном)</div>
  <div id="examples" class="examples"></div>
</div>

<script>
const VNAME={'GO':'ВЫПУСК РАЗРЕШЁН','WARN':'ПРОВЕРИТЬ','NO-GO':'ВЫЕЗД ЗАПРЕЩЁН',
  'CANNOT-ASSESS':'НЕ ОЦЕНИТЬ','NO-DATA':'НЕТ ДАННЫХ'};
const cls=d=>(d||'').replace(/-/g,'');

async function refreshDash(){
  try{
    const s=await (await fetch('/stats')).json();
    k('k-total',s.total); k('k-go',s.GO); k('k-block',s.blocked);
    k('k-na',(s['CANNOT-ASSESS']||0)+(s['NO-DATA']||0));
  }catch(e){}
  try{
    const rows=await (await fetch('/log?limit=15')).json();
    const b=document.getElementById('logbody');
    if(!rows.length){return;}
    b.innerHTML=rows.map(r=>{
      const t=(r.ts||'').replace('T',' ').slice(5,16);
      return `<tr><td class="mut">${t}</td>
        <td class="tk-no">${r.ticket||''}</td>
        <td>${r.tilt_deg!=null?r.tilt_deg+'°':'—'}</td>
        <td style="text-align:right"><span class="badge ${cls(r.decision)}">${r.decision}</span></td></tr>`;
    }).join('');
  }catch(e){}
}
function k(id,v){document.getElementById(id).textContent=(v==null?'0':v);}

async function analyzeBlob(blob){
  const fd=new FormData(); fd.append('file',blob,'photo.jpg');
  const r=await fetch('/analyze',{method:'POST',body:fd});
  render(await r.json());
  refreshDash();
}
async function run(){
  const f=document.getElementById('file').files[0];
  if(!f){alert('Выбери фото');return;}
  const b=document.getElementById('go'); b.disabled=true; b.textContent='Анализ…';
  try{ await analyzeBlob(f); }
  catch(e){ document.getElementById('out').innerHTML='<div class="card">Ошибка: '+e+'</div>'; }
  b.disabled=false; b.textContent='Проверить загрузку и выдать талон';
}
function render(d){
  const out=document.getElementById('out');
  if(d.error){out.innerHTML='<div class="card">Ошибка: '+d.error+'</div>';return;}
  const c=cls(d.decision);
  let rows='';
  (d.checks||[]).filter(x=>x.severity!=='roadmap').forEach(x=>{
    rows+=`<tr><td>${x.name}</td><td>${x.value}</td>
      <td style="text-align:right"><span class="pill ${x.severity}">${x.severity.toUpperCase()}</span></td></tr>`;
  });
  const ts=(d.ts||'').replace('T',' ').slice(0,16);
  out.innerHTML=`<div class="ticket ${c}">
    <div class="tk-top"><span class="tk-no">${d.ticket||'талон'}</span><span>${ts}</span></div>
    <div class="verdict">${d.decision}<small>${VNAME[d.decision]||''}</small></div>
    <div class="tk-body">
      <div class="mut">Крен кузова: <b>${d.tilt_deg}°</b> ${d.note?('· '+d.note):''}</div>
      <table>${rows}</table>
      ${d.annotated_image?`<img src="${d.annotated_image}">`:''}
    </div>
  </div>`;
}
async function loadExamples(){
  try{
    const list=await (await fetch('/examples')).json();
    document.getElementById('examples').innerHTML=list.map(d=>`
      <div class="ex ${cls(d.decision)}">
        <img src="${d.annotated_image}" alt="">
        <div class="exhead"><span>${d.title||''}</span><span class="exv">${d.decision}</span></div>
      </div>`).join('');
  }catch(e){}
}
loadExamples(); refreshDash();
</script>
</body>
</html>
