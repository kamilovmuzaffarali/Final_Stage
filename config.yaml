# Пороги и параметры Load Safety Gate. Меняются без правки кода.
tilt:
  warn_deg: 4.0        # крен кузова -> предупреждение
  nogo_deg: 7.0        # крен кузова -> запрет выезда
  conf_min: 0.45       # ниже -> «не оценить» (плохой ракурс/качество)

scale:
  body_width_m: 2.55   # стандартная ширина кузова -> масштаб для свеса (ПДД)

detector:
  truck_model: yolov8n.pt          # быстрый детектор грузовика (крен)
  world_model: yolov8s-world.pt    # zero-shot прицеп/груз (тугой бокс, свес)
  trailer_prompts: ["truck trailer", "truck cargo bed", "dump truck bed", "box truck body"]

# Пороги взяты из общих норм дорожного движения (ширина ТС до 2.55 м);
# локальные значения высоты/свеса подтверждаются по ПДД региона.
